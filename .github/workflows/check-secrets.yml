name: Check secrets

# The first thing to run on a fresh fork. It reads nothing but the presence of
# each secret, names the ones that are missing, and says where each value comes
# from. It never prints a value, and it posts nothing.
#
# Actions → Check secrets → Run workflow. Tick strict to be told about the
# optional sources too, which is what you want before the first daily run.

on:
  workflow_dispatch:
    inputs:
      strict:
        description: "Fail on the optional source secrets too (X, AgentMail)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job level rather than per step, so the Slack step can ask whether there is
    # a token to check before it spends a call finding out.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID || secrets.SLACK_CHANNEL_ID }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
      AGENTMAIL_INBOX_ID: ${{ vars.AGENTMAIL_INBOX_ID || secrets.AGENTMAIL_INBOX_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the secrets are there
        run: npm run check-env ${{ inputs.strict && '-- --strict' || '' }}

      # A token that cannot post is the failure a secrets check is meant to
      # catch, and only Slack can answer that. Skipped when there is no token.
      - name: Ask Slack what the bot token can do
        if: env.SLACK_BOT_TOKEN != ''
        run: npm run run -- --check-slack
