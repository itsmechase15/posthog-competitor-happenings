name: One-shot Slack cleanup (Otto)

on:
  push:
    branches: [main]
    paths: [".github/workflows/otto-cleanup-slack.yml"]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete Amplitude cookie-consent Slack message
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID || secrets.SLACK_CHANNEL_ID }}
        run: |
          set -euo pipefail
          CHANNEL="${SLACK_CHANNEL_ID:-C0C07A1DM09}"
          TS="1789511525.285309"
          RESP=$(curl -sS -X POST https://slack.com/api/chat.delete -H "Authorization: Bearer $SLACK_BOT_TOKEN" -H "Content-Type: application/json; charset=utf-8" -d "{\"channel\":\"$CHANNEL\",\"ts\":\"$TS\"}")
          echo "exact_ts_delete=$RESP"
          HIST=$(curl -sS "https://slack.com/api/conversations.history?channel=$CHANNEL&limit=30" -H "Authorization: Bearer $SLACK_BOT_TOKEN")
          python3 - "$HIST" "$SLACK_BOT_TOKEN" "$CHANNEL" <<'PY'
          import json, sys, urllib.request
          hist, token, channel = json.loads(sys.argv[1]), sys.argv[2], sys.argv[3]
          if not hist.get("ok"):
              print("history failed", hist); raise SystemExit(0)
          keys = ("cookie consent", "cookie-consent", "web-experiment-cookie-consent")
          for m in hist.get("messages", []):
              if any(k in json.dumps(m).lower() for k in keys):
                  body = json.dumps({"channel": channel, "ts": m["ts"]}).encode()
                  req = urllib.request.Request("https://slack.com/api/chat.delete", data=body, headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json; charset=utf-8"}, method="POST")
                  with urllib.request.urlopen(req) as resp: print("history_delete", m["ts"], resp.read().decode())
          PY

      - uses: actions/checkout@v4
      - name: Remove this cleanup workflow from main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/otto-cleanup-slack.yml
          git add -A
          git commit -m "chore: remove one-shot otto slack cleanup workflow"
          git push
