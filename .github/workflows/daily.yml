name: Daily competitor happenings

on:
  schedule:
    # GitHub cron is UTC only, so both DST offsets are scheduled and the job
    # bails out on the one that lands before 07:00 in Los Angeles today.
    - cron: "0 14 * * *" # 07:00 PDT
    - cron: "0 15 * * *" # 07:00 PST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the Slack payloads instead of posting them"
        type: boolean
        default: false

concurrency:
  group: competitor-happenings
  cancel-in-progress: false

# Each alert links a GitHub issue holding the detail Slack no longer carries.
permissions:
  contents: read
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    # The analyst reads its way around a few thousand docs pages per item now,
    # rather than answering one prompt, so a full run of new items takes longer
    # than it used to. The first run of a fresh database is the slow one: it
    # builds the whole corpus, where later runs mostly collect 304s. Every action
    # it files then gets a reviewer run of its own over the same corpus, and the
    # ones that need correcting get a rewrite too, which is where the extra
    # quarter of an hour goes.
    timeout-minutes: 75
    steps:
      - name: Check it is not before 07:00 in America/Los_Angeles
        id: window
        run: |
          hour="$(TZ=America/Los_Angeles date +%H)"
          # Only a too-early run bails. GitHub delays scheduled workflows under
          # load — an exact 07 match turns any late start into a silently
          # skipped day — and dedupe makes a second entry a no-op if both land.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$hour" -lt 7 ]; then
            echo "Local hour is $hour — too early, the later cron entry covers today."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.window.outputs.proceed == 'true'

      - uses: actions/setup-node@v4
        if: steps.window.outputs.proceed == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.window.outputs.proceed == 'true'

      - run: npm run build
        if: steps.window.outputs.proceed == 'true'

      # Fails in seconds, naming the secret and where its value comes from,
      # rather than twenty minutes in as a Postgres timeout or a silent channel.
      - name: Check the secrets are there
        if: steps.window.outputs.proceed == 'true'
        run: node dist/setup/check-env.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # The preflight judges the channel id too, so it has to be able to see
          # it. Reading it only in the step below let a missing channel through
          # the check that exists to catch exactly that.
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID || secrets.SLACK_CHANNEL_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          AGENTMAIL_INBOX_ID: ${{ vars.AGENTMAIL_INBOX_ID || secrets.AGENTMAIL_INBOX_ID }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}

      - name: Run one cycle
        if: steps.window.outputs.proceed == 'true'
        run: node dist/index.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          # The review pass. Both are optional: unset falls back to the defaults
          # in src/config.ts, which are claude-fable-5-1 reviewing and the
          # analyst's own model rewriting.
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          UPDATER_MODEL: ${{ vars.UPDATER_MODEL }}
          REVIEW_MAX_PER_RUN: ${{ vars.REVIEW_MAX_PER_RUN }}
          # Provided by Actions; opens the issue each Slack message links to, and
          # writes the review verdict back onto it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bot token is the preferred delivery path; the webhook is a fallback.
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # A channel id is not really a secret, but it is easy to store as one,
          # and reading only `vars` there leaves it silently empty.
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID || secrets.SLACK_CHANNEL_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          # An inbox address is not really a secret, but it is easy to store as
          # one, and reading only `vars` there leaves it silently empty.
          AGENTMAIL_INBOX_ID: ${{ vars.AGENTMAIL_INBOX_ID || secrets.AGENTMAIL_INBOX_ID }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
