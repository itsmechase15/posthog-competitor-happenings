name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # TEMPORARY presence probe. Prints "set"/"unset" only, never a value.
      # Removed in the same PR once it has answered.
      - name: Probe which config homes are populated
        env:
          VAR_SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          SECRET_SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          VAR_AGENTMAIL_INBOX_ID: ${{ vars.AGENTMAIL_INBOX_ID }}
          SECRET_AGENTMAIL_INBOX_ID: ${{ secrets.AGENTMAIL_INBOX_ID }}
        run: |
          for name in VAR_SLACK_CHANNEL_ID SECRET_SLACK_CHANNEL_ID \
                      VAR_AGENTMAIL_INBOX_ID SECRET_AGENTMAIL_INBOX_ID; do
            if [ -n "${!name}" ]; then echo "PROBE $name = set"; else echo "PROBE $name = unset"; fi
          done
